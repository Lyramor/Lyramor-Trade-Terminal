<!DOCTYPE html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/lyramor-favicon.png" />
    <title>Lyramor</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Lyramor type system: Geist (display) · Inter (body) · JetBrains Mono
         (data). Loaded from Google Fonts; if offline, the CSS font stacks in
         index.css fall back to the system sans/mono so text still renders. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // No-flash theme: mirror the persisted preference onto <html data-theme>
      // before first paint. Source of truth is the zustand theme store
      // (openalice.theme.v1); ui/src/theme re-applies + self-heals on boot.
      (function () {
        try {
          var raw = localStorage.getItem('openalice.theme.v1');
          var t = raw ? (JSON.parse(raw).state || {}).theme : 'auto';
          document.documentElement.dataset.theme =
            t === 'light' || t === 'dark' ? t : 'auto';
        } catch (e) {
          document.documentElement.dataset.theme = 'auto';
        }
      })();
    </script>
  </head>
  <body class="h-full bg-bg text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
